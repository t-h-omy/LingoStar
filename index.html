<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <title>LingoStar - English Irregular Verbs</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Top: Current Word and Star (Prominent Header) -->
        <div id="top-bar">
            <div id="current-star"></div>
            <div id="star-summary"></div>
        </div>

        <!-- Center: Exercise Area -->
        <div id="exercise-container">
            <div id="question-text"></div>
            <div id="answer-area"></div>
        </div>

        <!-- Bottom: Feedback and Button -->
        <div id="bottom-bar">
            <div id="feedback-text"></div>
            <button id="ok-button">OK</button>
        </div>
    </div>

    <!-- Version indicator -->
    <div id="version">v1.2.0</div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
