<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <title>LingoStar - English Irregular Verbs</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="16x16" href="assets/appicon/icon_16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/appicon/icon_32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/appicon/icon_48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/appicon/icon_64x64.png">
    <link rel="apple-touch-icon" sizes="72x72" href="assets/appicon/icon_72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="assets/appicon/icon_96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="assets/appicon/icon_128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="assets/appicon/icon_144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/appicon/icon_152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/appicon/icon_192x192.png">
    <link rel="apple-touch-icon" sizes="256x256" href="assets/appicon/icon_256x256.png">
    <link rel="apple-touch-icon" sizes="384x384" href="assets/appicon/icon_384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="assets/appicon/icon_512x512.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Burger Menu Icon -->
        <button id="burger-menu-icon" aria-label="Open menu">☰</button>
        
        <!-- Top: Current Word and Star (Prominent Header) -->
        <div id="top-bar">
            <div id="current-star"></div>
            <div id="star-summary"></div>
        </div>

        <!-- Center: Exercise Area -->
        <div id="exercise-container">
            <div id="question-text"></div>
            <div id="answer-area"></div>
        </div>

        <!-- Bottom: Feedback and Button -->
        <div id="bottom-bar">
            <div id="feedback-text"></div>
            <button id="ok-button">OK</button>
        </div>
    </div>

    <!-- Version indicator -->
    <div id="version">v1.3.0</div>
    
    <!-- Update notification -->
    <div id="update-notification" style="display: none;">
        <button id="update-button">New Version Available</button>
    </div>

    <!-- Burger Menu Modal -->
    <div id="burger-menu" class="burger-menu" style="display: none;">
        <div class="burger-menu-content">
            <button id="burger-menu-close" class="burger-menu-close" aria-label="Close menu">✕</button>
            
            <h2>Settings</h2>
            
            <!-- Sound Toggle -->
            <div class="menu-item">
                <label class="menu-label">Sound</label>
                <button id="sound-toggle" class="toggle-switch" aria-label="Toggle sound">
                    <span class="toggle-icon">🔊</span>
                </button>
            </div>
            
            <!-- Dictionary -->
            <div class="menu-item">
                <button id="dictionary-button" class="menu-button">
                    📖 Dictionary
                </button>
            </div>
            
            <!-- Delete Save Game -->
            <div class="menu-item">
                <button id="delete-save-button" class="menu-button danger">
                    🗑️ Delete Save Game
                </button>
            </div>
        </div>
    </div>

    <!-- Dictionary Modal -->
    <div id="dictionary-modal" class="modal" style="display: none;">
        <div class="modal-content dictionary-content">
            <button id="dictionary-close" class="modal-close" aria-label="Close dictionary">✕</button>
            <h2>Dictionary</h2>
            <div id="dictionary-list" class="dictionary-list"></div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal" style="display: none;">
        <div class="modal-content confirmation-content">
            <h3 id="confirmation-message">Are you sure?</h3>
            <div class="confirmation-buttons">
                <button id="confirmation-cancel" class="modal-button">Cancel</button>
                <button id="confirmation-confirm" class="modal-button danger">Delete</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
